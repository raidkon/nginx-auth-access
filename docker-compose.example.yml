# Пример docker-compose для опубликованного образа.
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp config.example.toml config.toml
#   # отредактируйте config.toml (signing_key, panel_hostname, net_safe_access)
#   mkdir -p data/logs
#   sudo chown -R "${NGINX_AUTH_ACCESS_UID:-1000}:${NGINX_AUTH_ACCESS_GID:-1000}" data
#   docker compose up -d
#
# Пользователь процесса по умолчанию 1000:1000. Другой UID/GID:
#   NGINX_AUTH_ACCESS_UID=2000 NGINX_AUTH_ACCESS_GID=2000 docker compose up -d
# или в docker-compose.yml: user: "2000:2000" (перекрывает переменные ниже).
# Каталог data/ на хосте должен принадлежать тому же UID:GID.
#
# Порты 80/81 — только внутри сети compose (expose). Для nginx на той же сети:
#   proxy_pass http://nginx-auth-access:80;
#   auth_request → http://nginx-auth-access:81/internal/verify
# Локальная проверка с хоста — раскомментируйте ports ниже.
#
# Образ публикуется при релизе (git tag v*):
#   ghcr.io/raidkon/nginx-auth-access:latest
#   ghcr.io/raidkon/nginx-auth-access:v1.0.0

services:
  nginx-auth-access:
    image: ghcr.io/raidkon/nginx-auth-access:${NGINX_AUTH_ACCESS_VERSION:-latest}
    container_name: nginx-auth-access
    restart: unless-stopped
    user: "${NGINX_AUTH_ACCESS_UID:-1000}:${NGINX_AUTH_ACCESS_GID:-1000}"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      ACCESS_CONFIG_PATH: /etc/nginx-auth-access/config.toml
    volumes:
      - ./config.toml:/etc/nginx-auth-access/config.toml:ro
      - ./data:/data
    expose:
      - "80"
      - "81"
    # ports:
    #   - "8080:80"
    #   - "8081:81"
