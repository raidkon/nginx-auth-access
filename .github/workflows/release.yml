name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binaries:
    name: Build release tarballs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build
          rsync -a --delete dist/frontend/browser/ ../backend/internal/uiembed/browser/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build linux binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for pair in amd64:amd64 arm64:arm64; do
            GOARCH="${pair#*:}"
            ARCH="${pair%%:*}"
            out="dist/nginx-auth-access-linux-${ARCH}"
            root="dist/root-${ARCH}"
            rm -rf "$root"
            mkdir -p \
              "$root/usr/local/bin" \
              "$root/etc/nginx-auth-access" \
              "$root/lib/systemd/system"

            (
              cd backend
              CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
                go build -trimpath -ldflags="-s -w" \
                -o "../${out}" ./cmd/access
            )

            cp "${out}" "$root/usr/local/bin/nginx-auth-access"
            cp packaging/nginx-auth-access.service "$root/lib/systemd/system/"
            cp config.example.toml "$root/etc/nginx-auth-access/"
            tar -czf "nginx-auth-access_${VERSION}_linux_${ARCH}.tar.gz" -C "$root" .
          done

          sha256sum nginx-auth-access_*.tar.gz > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            nginx-auth-access_*_linux_*.tar.gz
            SHA256SUMS

  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nginx-auth-access_*_linux_*.tar.gz
            SHA256SUMS
